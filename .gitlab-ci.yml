stages:
  - package
  - deploy

package-frontend:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" .
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  only:
    - main
deploy-ec2:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    - |
      ssh -i "$SSH_PRIVATE_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" '
        set -e
        cd ~/PIS-DellAnnaRizzo-SkillMatch-backend
        docker compose -f docker-compose.prod.yml pull frontend
        docker compose -f docker-compose.prod.yml up -d frontend
      '
  only:
    - main    